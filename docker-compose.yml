services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: employees
      POSTGRES_USER: employee_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_db_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U employee_app -d employees"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    restart: unless-stopped
    ports: ["5000:5000"]
    environment:
      DATABASE_URL: postgresql+psycopg://employee_app:${POSTGRES_PASSWORD:-local_dev_db_password}@db:5432/employees
      SECRET_KEY: ${SECRET_KEY:-local-development-secret-change-me}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
