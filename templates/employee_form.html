{% extends "base.html" %}{% block title %}Employee form · EmployeeHub{% endblock %}{% block content %}
<div class="mb-4"><a href="{{ url_for('employees') }}">← Back to employees</a><h1 class="h2 fw-bold mt-3">{{ 'Edit employee' if employee.id else 'Add employee' }}</h1><p class="text-secondary">Enter employee details below.</p></div>
<div class="panel form-panel"><form method="post"><div class="row g-3">
<div class="col-md-6"><label class="form-label">Full name *</label><input class="form-control" name="name" required value="{{ employee.name or '' }}"></div>
<div class="col-md-6"><label class="form-label">Email *</label><input class="form-control" type="email" name="email" required value="{{ employee.email or '' }}"></div>
<div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone" value="{{ employee.phone or '' }}"></div>
<div class="col-md-6"><label class="form-label">Designation</label><input class="form-control" name="designation" value="{{ employee.designation or '' }}"></div>
<div class="col-md-6"><label class="form-label">Salary (INR)</label><input class="form-control" type="number" min="0" step=".01" name="salary" value="{{ employee.salary or 0 }}"></div>
<div class="col-md-6"><label class="form-label">Joining date</label><input class="form-control" type="date" name="joining_date" value="{{ employee.joining_date.isoformat() if employee.joining_date else '' }}"></div>
<div class="col-12"><label class="form-label">Department</label><select class="form-select" name="department_id"><option value="">No department</option>{% for d in departments %}<option value="{{ d.id }}" {% if employee.department_id == d.id %}selected{% endif %}>{{ d.name }}</option>{% endfor %}</select></div></div>
<div class="d-flex gap-2 mt-4"><button class="btn btn-primary">Save employee</button><a class="btn btn-light" href="{{ url_for('employees') }}">Cancel</a></div></form></div>{% endblock %}
